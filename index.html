<!doctype html>

*{box-sizing:border-box}body{margin:0;background:#f3f8ee;color:#173e29;font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif}main{max-width:1060px;margin:auto;padding:14px}.poster{display:block;width:100%;height:auto;border-radius:16px;box-shadow:0 10px 30px #163d2520}.panel{background:white;border:1px solid #dcead7;border-radius:19px;padding:26px;margin:18px 0;box-shadow:0 6px 22px #163d250b}.eyebrow{color:#33804a;font-weight:800}h1{font-size:clamp(24px,4vw,36px);margin:8px 0}p{line-height:1.7}.coupons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:22px 0}.coupon{position:relative;overflow:hidden;background:linear-gradient(145deg,#fffef0,#f4f9e9);border:2px dashed #77ae65;border-radius:18px;padding:20px 18px 18px;text-align:center}.coupon:before,.coupon:after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:white;top:57%;border:2px solid #77ae65}.coupon:before{left:-14px}.coupon:after{right:-14px}.tag{display:inline-block;background:#e5f4d8;border-radius:30px;color:#28683b;font-weight:800;padding:4px 12px;font-size:13px}.coupon h2{font-size:clamp(17px,2.4vw,23px);margin:12px 0 0}.amount{color:#d52f1c;font-size:clamp(48px,7vw,76px);font-weight:950;line-height:1.2}.amount small{font-size:19px}.coupon p{font-size:13px;color:#687766;margin:6px 0 15px}.claim{display:block;width:100%;background:#df3c25;color:white;border:0;border-radius:30px;padding:13px 10px;font-weight:850;font-size:17px;cursor:pointer}.claim .limit{font-size:12px;font-weight:600;white-space:nowrap}.claim.selected{background:#287a44}.meta{background:#f5f9ef;border-radius:13px;padding:16px;line-height:2}.code{font-size:21px;font-weight:900;letter-spacing:.04em;color:#226438;user-select:all}.copy{background:#267345;color:white;border:0;border-radius:9px;padding:8px 12px;margin-left:10px;cursor:pointer}.line{background:linear-gradient(140deg,#edfbea,#fff);border:1px solid #cde7ca;text-align:center}.line h2{margin:4px 0;font-size:24px}.lin </style></head><body><main><img class="poster" src="poster.jpg" alt="CoCo 環保系列：任選兩杯39元、自帶環保杯每杯10元，10/26至10/30，優惠代碼COCO15668"><section class="panel"><div class="eyebrow">限時 5 天・環保系列優惠</div><h1>CoCo 環保系列優惠券</h1><p>一杯好飲，從自帶開始！兩款限時優惠，選擇你想了解的優惠券。</p><div class="coupons"><article class="coupon"><span class="tag">限時優惠</span><h2>任選 2 杯</h2><div class="amount">39<small> 元</small></div><p>多款人氣飲品適用</p><button type="button" class="claim" onclick="selectCoupon(this,'任選2杯39元')">立即領取 <span class="limit">（每人限領一張）</span></button></article><article class="coupon"><span class="tag">環保杯專屬</span><h2>自帶環保杯</h2><div class="amount">10<small> 元／杯</small></div><p>自備環保杯・減塑更永續</p><button type="button" class="claim" onclick="selectCoupon(this,'自帶環保杯每杯10元')">立即領取 <span class="limit">（每人限領一張）</span></button></article></div><div class="meta"><b>活動日期：</b>2026/10/26（一）～10/30（五）<br><b>優惠代碼：</b><span class="code" id="couponCode">COCO15668</span><button class="copy" type="button" onclick="copyCode()">複製</button><br><b>活動提醒：</b>限時限量，售完為止。</div><p class="note" id="selection" role="status">點擊「立即領取」將顯示領取提示，不會跳轉頁面。</p></section><section class="panel line"><div class="eyebrow">活動諮詢・兌換說明</div><h2>COCO都可官方客服</h2><p>請點擊下方網站</p><a class="linebtn" id="lineBtn" href="#" onclick="return openLine(event)">COCO都可官方網站</a><p class="linehint" id="lineHint">專屬官方鏈接</p></section></main><footer>活動資訊整理頁｜CoCo 官方網站</footer><script>
